name: Ubuntu

on:
  # A tag runs release.yml only, which runs the tests itself.
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # System HarfBuzz (foreign import is "system:harfbuzz" on Linux) plus the
      # X11/Wayland/GL libraries raylib links against.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libharfbuzz-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      - uses: laytan/setup-odin@v2
        with:
          release: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      # Odin ships prebuilt vendor:stb only for Windows and macOS; font/text.odin
      # imports stb/truetype, so Linux has to compile them first. Newer Odin
      # replaced the Makefile with build_stb.sh; older releases still need make.
      - name: Build vendor STB libraries
        run: |
          src="$(odin root)vendor/stb/src"
          if [ -f "$src/build_stb.sh" ]; then
            sh "$src/build_stb.sh" unix
          else
            make -C "$src"
          fi

      # The key holds build.odin, which pins each grammar to a commit, so a new
      # pin makes a new cache.
      - name: Name the tree-sitter cache
        id: ts
        shell: bash
        run: echo "rev=$(git rev-parse HEAD:vendor/odin-tree-sitter)" >> "$GITHUB_OUTPUT"

      - name: Cache tree-sitter
        uses: actions/cache@v4
        with:
          path: |
            vendor/odin-tree-sitter/tree-sitter
            vendor/odin-tree-sitter/parsers
          key: tree-sitter-${{ runner.os }}-${{ runner.arch }}-${{ steps.ts.outputs.rev }}-${{ hashFiles('build.odin', 'syntax/syntax.odin') }}-v1

      # build.odin builds the parsers of its GRAMMARS list, each at its pinned
      # commit, and skips each library the cache restored, so this workflow
      # keeps no list of its own.
      - name: Build the dependencies
        run: odin run build.odin -file -- deps -verbose

      - name: Check with -vet
        run: odin run build.odin -file -- check -vet -verbose

      - name: Build Thor
        run: odin build main -debug

      # Every package that has tests, from the root of the repository, so the
      # tests find assets/, plugins/ and settings/. No test opens a window, so
      # the runner needs no display.
      - name: Run the tests
        run: odin run build.odin -file -- test -verbose
