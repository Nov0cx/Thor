name: Ubuntu

on:
  # A tag runs release.yml only, which runs the tests itself.
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The oldest glibc the Linux build supports is 2.31, so it builds on Ubuntu
      # 20.04. A binary links against the glibc of the machine that built it.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates gnupg lsb-release \
            software-properties-common wget binutils \
            libharfbuzz-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev

      # Ubuntu 20.04 ships LLVM 10; Odin needs a newer one.
      - name: Install LLVM 18
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          bash /tmp/llvm.sh 18
          apt-get install -y --no-install-recommends llvm-18-dev
          ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The container runs as root over runner-owned files.
      - name: Trust the checked out repository
        run: git config --global --add safe.directory '*'

      # The prebuilt Linux Odin can need a newer glibc than 2.31, so Odin is
      # built here from the newest release tag.
      - name: Build Odin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/odin-lang/Odin/releases/latest \
            | grep -oE '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          if [ -z "$tag" ]; then
            echo "No Odin release tag found" >&2
            exit 1
          fi
          git clone --depth 1 --branch "$tag" https://github.com/odin-lang/Odin.git /opt/odin
          cd /opt/odin
          LLVM_CONFIG=llvm-config-18 CXX=clang++-18 ./build_odin.sh release
          echo /opt/odin >> "$GITHUB_PATH"

      # Odin ships prebuilt vendor:stb only for Windows and macOS; font/text.odin
      # imports stb/truetype, so Linux has to compile them first.
      - name: Build vendor STB libraries
        run: |
          src="$(odin root)vendor/stb/src"
          if [ -f "$src/build_stb.sh" ]; then
            (cd "$src" && sh ./build_stb.sh unix)
          else
            make -C "$src"
          fi

      # The key holds build.odin, which pins each grammar to a commit, so a new
      # pin makes a new cache.
      - name: Name the tree-sitter cache
        id: ts
        run: echo "rev=$(git rev-parse HEAD:vendor/odin-tree-sitter)" >> "$GITHUB_OUTPUT"

      - name: Cache tree-sitter
        uses: actions/cache@v4
        with:
          path: |
            vendor/odin-tree-sitter/tree-sitter
            vendor/odin-tree-sitter/parsers
          key: tree-sitter-focal-${{ runner.arch }}-${{ steps.ts.outputs.rev }}-${{ hashFiles('build.odin', 'syntax/syntax.odin') }}-v1

      # build.odin builds the parsers of its GRAMMARS list, each at its pinned
      # commit, and skips each library the cache restored, so this workflow
      # keeps no list of its own.
      - name: Build the dependencies
        run: odin run build.odin -file -- deps -verbose

      - name: Check with -vet
        run: odin run build.odin -file -- check -vet -verbose

      - name: Build Thor
        run: |
          mkdir -p bin
          odin build main -debug -out:bin/thor

      # A symbol newer than GLIBC_2.31 would stop the binary from loading on the
      # oldest supported distribution.
      - name: Check the glibc version
        run: |
          newest=$(objdump -T bin/thor | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -uV | tail -1)
          echo "Newest glibc symbol: $newest"
          if [ "$(printf '%s\nGLIBC_2.31\n' "$newest" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "bin/thor needs $newest; the limit is GLIBC_2.31" >&2
            exit 1
          fi

      # Every package that has tests, from the root of the repository, so the
      # tests find assets/, plugins/ and settings/. No test opens a window, so
      # the runner needs no display.
      - name: Run the tests
        run: odin run build.odin -file -- test -verbose
