name: macOS

on:
  # A tag runs release.yml only, which runs the tests itself.
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # vendor:lua links Lua statically on Linux and against lua54.dll on Windows,
      # but on Darwin it is `system:lua5.4`, so Lua is a build dependency here.
      # The version matters: the unversioned `lua` formula is 5.5 now, and
      # vendor:lua/5.4 does not match its ABI. Nothing fails at link time - the
      # symbol names are the same - so the mismatch only shows as a crash once a
      # plugin runs.
      - name: Install HarfBuzz and Lua
        run: brew install harfbuzz lua@5.4

      # Homebrew names the library liblua.5.4.dylib; the linker asks for -llua5.4.
      # lua@5.4 is keg-only, so the link also brings it into the prefix the build
      # points the linker at.
      - name: Name Lua the way the linker asks for it
        run: |
          keg="$(brew --prefix lua@5.4)/lib"
          dylib="$(ls "$keg"/liblua*.dylib | head -n1)"
          ln -sf "$dylib" "$(brew --prefix)/lib/liblua5.4.dylib"

      # The odin-harfbuzz binding only wires up Windows and Linux; on Darwin no
      # `foreign import` matches and the build fails to link. Inject a Darwin
      # branch (Homebrew's libharfbuzz, same as Linux) into every binding file.
      - name: Add Darwin branch to HarfBuzz binding
        run: |
          find vendor/odin-harfbuzz -name '*.odin' -print0 | xargs -0 perl -0pi -e \
            's/(else when ODIN_OS == \.Linux\s*\{\s*foreign import (\w+) "system:harfbuzz"\s*\})/$1 else when ODIN_OS == .Darwin \{ foreign import $2 "system:harfbuzz" \}/g'

      - uses: laytan/setup-odin@v2
        with:
          release: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      # The key holds build.odin, which pins each grammar to a commit, so a new
      # pin makes a new cache.
      - name: Name the tree-sitter cache
        id: ts
        shell: bash
        run: echo "rev=$(git rev-parse HEAD:vendor/odin-tree-sitter)" >> "$GITHUB_OUTPUT"

      - name: Cache tree-sitter
        uses: actions/cache@v4
        with:
          path: |
            vendor/odin-tree-sitter/tree-sitter
            vendor/odin-tree-sitter/parsers
          key: tree-sitter-${{ runner.os }}-${{ runner.arch }}-${{ steps.ts.outputs.rev }}-${{ hashFiles('build.odin', 'syntax/syntax.odin') }}-v1

      # build.odin builds the parsers of its GRAMMARS list, each at its pinned
      # commit, and skips each library the cache restored, so this workflow
      # keeps no list of its own.
      - name: Build the dependencies
        run: odin run build.odin -file -- deps -verbose

      - name: Check with -vet
        run: odin run build.odin -file -- check -vet -verbose

      # Point the linker at Homebrew's lib dir so -lharfbuzz resolves.
      - name: Build Thor
        run: odin build main -debug -extra-linker-flags:"-L$(brew --prefix)/lib"

      # Every package that has tests, from the root of the repository, so the
      # tests find assets/, plugins/ and settings/. No test opens a window, so
      # the runner needs no display. build.odin points the linker at
      # $HOMEBREW_PREFIX/lib, which the runner sets.
      - name: Run the tests
        run: odin run build.odin -file -- test -verbose
