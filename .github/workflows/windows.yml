name: Windows

on:
  # A tag runs release.yml only, which runs the tests itself.
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Puts cl/lib/link on PATH; required to build HarfBuzz, the tree-sitter
      # runtime/parsers, and to link Thor (vendor:harfbuzz + libtree-sitter).
      - uses: ilammy/msvc-dev-cmd@v1

      # build.odin holds the HarfBuzz version. The stamp names the archive and
      # the meson flags the library was built from; a library with a stale
      # stamp is built again, so bump the suffix of the key with either.
      - name: Name the HarfBuzz cache
        id: keys
        shell: bash
        run: |
          harfbuzz="$(sed -n 's/^HARFBUZZ_VERSION :: "\(.*\)"\r\{0,1\}$/\1/p' build.odin)"
          if [ -z "$harfbuzz" ]; then
            echo "build.odin names no HARFBUZZ_VERSION" >&2
            exit 1
          fi
          echo "harfbuzz=$harfbuzz" >> "$GITHUB_OUTPUT"

      - name: Cache HarfBuzz
        id: harfbuzz
        uses: actions/cache@v4
        with:
          path: |
            vendor/odin-harfbuzz/libs/harfbuzz.lib
            vendor/harfbuzz.stamp
          key: harfbuzz-windows-mt-${{ steps.keys.outputs.harfbuzz }}-v2

      # Only the HarfBuzz build needs Python, meson and ninja.
      - uses: actions/setup-python@v5
        if: steps.harfbuzz.outputs.cache-hit != 'true'
        with:
          python-version: "3.x"

      - uses: laytan/setup-odin@v2
        with:
          release: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install meson and ninja
        if: steps.harfbuzz.outputs.cache-hit != 'true'
        run: python -m pip install --upgrade pip meson ninja

      # The key holds build.odin, which pins each grammar to a commit, so a new
      # pin makes a new cache.
      - name: Name the tree-sitter cache
        id: ts
        shell: bash
        run: echo "rev=$(git rev-parse HEAD:vendor/odin-tree-sitter)" >> "$GITHUB_OUTPUT"

      - name: Cache tree-sitter
        uses: actions/cache@v4
        with:
          path: |
            vendor/odin-tree-sitter/tree-sitter
            vendor/odin-tree-sitter/parsers
          key: tree-sitter-${{ runner.os }}-${{ runner.arch }}-${{ steps.ts.outputs.rev }}-${{ hashFiles('build.odin', 'syntax/syntax.odin') }}-v1

      # HarfBuzz is a local static library on Windows. build.odin builds it from
      # a checksummed archive, and the parsers of its GRAMMARS list each at its
      # pinned commit. It skips each library the cache restored, so this
      # workflow keeps no list of its own.
      - name: Build the dependencies
        run: odin run build.odin -file -- deps -verbose

      - name: Check with -vet
        run: odin run build.odin -file -- check -vet -verbose

      - name: Build Thor
        shell: pwsh
        run: odin build main -debug

      # Every package that has tests, from the root of the repository, so the
      # tests find assets/, plugins/ and settings/. No test opens a window, so
      # the runner needs no display.
      - name: Run the tests
        shell: pwsh
        run: odin run build.odin -file -- test -verbose
