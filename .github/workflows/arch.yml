name: Arch Linux

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: arch-${{ github.ref }}
  cancel-in-progress: true

env:
  # Grammars that syntax/syntax.odin hard-imports; each must be installed before
  # the app will type-check/build (see vendor/README.md).
  TS_ODIN: https://github.com/tree-sitter-grammars/tree-sitter-odin
  TS_LUA: https://github.com/tree-sitter-grammars/tree-sitter-lua
  TS_C: https://github.com/tree-sitter/tree-sitter-c
  TS_CPP: https://github.com/tree-sitter/tree-sitter-cpp
  TS_GO: https://github.com/tree-sitter/tree-sitter-go
  TS_JS: https://github.com/tree-sitter/tree-sitter-javascript
  # typescript and tsx are two grammars in one repo, selected by subdirectory.
  TS_TS: https://github.com/tree-sitter/tree-sitter-typescript
  TS_JAI: https://github.com/constantitus/tree-sitter-jai
  TS_RUST: https://github.com/tree-sitter/tree-sitter-rust
  TS_PYTHON: https://github.com/tree-sitter/tree-sitter-python
  TS_RUBY: https://github.com/tree-sitter/tree-sitter-ruby
  TS_JAVA: https://github.com/tree-sitter/tree-sitter-java
  TS_KOTLIN: https://github.com/fwcd/tree-sitter-kotlin
  TS_ZIG: https://github.com/tree-sitter-grammars/tree-sitter-zig
  TS_CSHARP: https://github.com/tree-sitter/tree-sitter-c-sharp
  # php and ocaml keep their grammar in a subdirectory, selected with -path.
  TS_PHP: https://github.com/tree-sitter/tree-sitter-php
  TS_HASKELL: https://github.com/tree-sitter/tree-sitter-haskell
  TS_OCAML: https://github.com/tree-sitter/tree-sitter-ocaml
  TS_STARLARK: https://github.com/tree-sitter-grammars/tree-sitter-starlark
  TS_HCL: https://github.com/tree-sitter-grammars/tree-sitter-hcl
  TS_NIX: https://github.com/nix-community/tree-sitter-nix
  TS_PASCAL: https://github.com/Isopod/tree-sitter-pascal
  TS_NIM: https://github.com/alaviss/tree-sitter-nim
  TS_COMMONLISP: https://github.com/tree-sitter-grammars/tree-sitter-commonlisp

jobs:
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # base image is bare: install the toolchain (Odin links via clang), the
      # tools the actions need (git/nodejs), system HarfBuzz and raylib's deps.
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git nodejs curl tar grep \
            llvm clang \
            harfbuzz \
            libx11 libxrandr libxinerama libxcursor libxi mesa wayland libxkbcommon

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # No setup-odin here (it assumes an Ubuntu-style toolchain); grab the
      # official prebuilt linux release instead — it runs fine on Arch's glibc.
      - name: Install Odin
        run: |
          # --fail and a retry: a bad response otherwise lands in odin.tar.gz and
          # is only reported by tar, as "not in gzip format".
          url=$(curl -fsSL --retry 3 --retry-all-errors https://api.github.com/repos/odin-lang/Odin/releases/latest \
            | grep -oE 'https://[^"]*odin-linux-amd64[^"]*\.tar\.gz' | head -1)
          if [ -z "$url" ]; then
            echo "no odin-linux-amd64 asset in the latest release" >&2
            exit 1
          fi
          curl -fL --retry 3 --retry-all-errors "$url" -o odin.tar.gz
          mkdir -p /opt/odin && tar xzf odin.tar.gz -C /opt/odin
          echo "$(dirname "$(find /opt/odin -maxdepth 3 -type f -name odin | head -1)")" >> "$GITHUB_PATH"

      # Odin ships prebuilt vendor:stb only for Windows and macOS; ui/text.odin
      # imports stb/truetype, so Linux has to compile them first. Newer Odin
      # replaced the Makefile with build_stb.sh; older releases still need make.
      - name: Build vendor STB libraries
        run: |
          src="$(odin root)vendor/stb/src"
          if [ -f "$src/build_stb.sh" ]; then
            sh "$src/build_stb.sh" unix
          else
            make -C "$src"
          fi

      - name: Build tree-sitter runtime + parsers
        working-directory: vendor/odin-tree-sitter
        run: |
          odin run build -- install
          odin run build -- install-parser "$TS_ODIN" -yes
          odin run build -- install-parser "$TS_LUA" -yes
          odin run build -- install-parser "$TS_C" -yes
          odin run build -- install-parser "$TS_CPP" -yes
          odin run build -- install-parser "$TS_GO" -yes
          odin run build -- install-parser "$TS_JS" -yes
          odin run build -- install-parser "$TS_TS" -path=typescript -name=typescript -yes
          odin run build -- install-parser "$TS_TS" -path=tsx -name=tsx -yes
          odin run build -- install-parser "$TS_JAI" -yes
          odin run build -- install-parser "$TS_RUST" -yes
          odin run build -- install-parser "$TS_PYTHON" -yes
          odin run build -- install-parser "$TS_RUBY" -yes
          odin run build -- install-parser "$TS_JAVA" -yes
          odin run build -- install-parser "$TS_KOTLIN" -yes
          odin run build -- install-parser "$TS_ZIG" -yes
          odin run build -- install-parser "$TS_CSHARP" -name=c_sharp -yes
          odin run build -- install-parser "$TS_PHP" -path=php -name=php -yes
          odin run build -- install-parser "$TS_HASKELL" -yes
          odin run build -- install-parser "$TS_OCAML" -path=grammars/ocaml -name=ocaml -yes
          odin run build -- install-parser "$TS_STARLARK" -yes
          odin run build -- install-parser "$TS_HCL" -yes
          odin run build -- install-parser "$TS_NIX" -yes
          odin run build -- install-parser "$TS_PASCAL" -yes
          odin run build -- install-parser "$TS_NIM" -yes
          odin run build -- install-parser "$TS_COMMONLISP" -yes

      - name: Build Thor
        run: odin build main -debug

      # Every package that has tests, from the root of the repository, so the
      # tests find assets/, plugins/ and settings/. No test opens a window, so
      # the runner needs no display.
      - name: Run the tests
        run: odin run build.odin -file -- test -verbose
